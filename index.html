<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Banda Sleipnir</title>
        <style>
            header {
                background-color: #3A3333;
                color: #FFFFFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                }

            main {
                background-color: #3A3333;
                color: #FFFFFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                }
                
                article{
                    display: flex;
                }
                
            img {
                width: 80px;
                height: 80px;
            }
            .nome-banda {
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <main>
            <article>
                <img src="wotan-in-sleipnir.webp" alt="Ilustração circular em preto e branco do deus nórdico Odin cavalgando o cavalo de oito patas Sleipnir. Ele segura uma lança e um escudo, acompanhado por dois corvos voando. O desenho é emoldurado por um círculo com runas nórdicas e inclui o símbolo Valknut abaixo do cavalo.">
        <h1 class="nome-banda">Sleipnir</h1>
        
        <div>
            <h2>Informações Básicas</h2>
            <p><i>Informações sobre a banda e repertório</i></p>
            <p>Somos uma banda de metal focada no estilo músical dos anos 1970 a 2000, temos um vocalista, um guitarrista e um baixista. Nossa formação foi em 2022, enquanto ainda estávamos na sexta série do ensino fundamental II</p>
             <button>❤ <span>0</span></button>
        </div>
            </article>
      
    </main>
</body>
<script>
       const botao = document.querySelector ("button");    
       botao.forEach(function (botao) {
        let curtiu = false;
       botao.addEventListener ("click", botaoClicado);
       function botaoClicado() {
           console.log("fui clicado");
           let texto = botao.querySelector("span");
           if (curtiu === false){
               texto.textContent++
               curtiu = true;
            } else {
                texto.textContent--;
                curtiu = false;
            }
       }
       })

</script>
</html>
